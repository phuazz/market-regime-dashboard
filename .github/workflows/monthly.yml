# Refreshes the monthly cadence group (Sahm rule, PMI proxy, LEI headline,
# Shiller CAPE, consumer sentiment, P/E percentile, Rule of 20, IPO proxy)
# and the quarterly group (SLOOS). Monthly prints land on scattered days, so
# this polls weekly; history files append at most one point per period.
name: Monthly and quarterly data refresh

on:
  schedule:
    # 12:00 UTC every Monday (20:00 Singapore).
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt "pytest>=8"

      # Run under pytest, not unittest discovery: tests/test_emit_state.py is
      # pytest-style, so discovery imported it (failing for want of the module
      # from 2026-08-27 to 2026-09-02) yet would never have collected its tests.
      - name: Run offline tests
        run: python -m pytest tests -q

      - name: Update monthly-group and quarterly-group data
        id: update
        shell: bash
        run: |
          set +e
          python scripts/update_data.py --group monthly | tee refresh.log
          monthly_exit=${PIPESTATUS[0]}
          python scripts/update_data.py --group quarterly | tee -a refresh.log
          quarterly_exit=${PIPESTATUS[0]}
          echo "exit_code=$((monthly_exit + quarterly_exit))" >> "$GITHUB_OUTPUT"

      - name: Build docs
        run: python scripts/build.py

      - name: Commit and push refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Automated monthly-group data refresh"
          # data/ and docs/ are regenerated outputs of the same deterministic
          # pipeline over the same sources, so a run that published while this
          # one was building holds a version as good as this one's. Yield to it
          # rather than hand-merge generated JSON, and do not fail the run: the
          # data is not lost, it is superseded, and the next run regenerates.
          # Seen 2026-08-25 when the daily and monthly runs were dispatched
          # seconds apart; the twelve-hour gap in the schedules normally
          # prevents it, so this is the guard for the manual case.
          if ! git pull --rebase origin main; then
            git rebase --abort
            git reset --hard origin/main
            echo "A concurrent refresh published first; this run's data was superseded."
            exit 0
          fi
          if ! git push origin main; then
            echo "Push rejected by a concurrent refresh; this run's data was superseded."
            exit 0
          fi

      # The run still goes red on the first failure — that is the earliest signal
      # and a parser is usually a one-sitting fix. What changed is that the
      # message names the builders and any row that parked, so four weeks of
      # failures do not read as four identical emails. This workflow failed
      # every run from 2026-07-27 to 2026-08-24 with the same body.
      - name: Surface builder failures
        if: steps.update.outputs.exit_code != '0'
        shell: bash
        run: |
          {
            echo "### Builder failures"
            echo '```'
            grep -E '^(ERROR|WARNING|  PARKED)' refresh.log || echo "(see the refresh step log)"
            echo '```'
            echo "Previous values were retained for those rows. A row parks once it has"
            echo "been failing past its group budget: it is shown as context, excluded"
            echo "from the lens roll-up, and labelled stale on the page and in the digest."
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(ERROR|WARNING|  PARKED)' refresh.log || true
          exit 1
