# Refreshes the daily cadence group (yield curve, HY OAS, labour internals,
# S&P 500 trend) and redeploys docs/. A failing builder keeps its previous
# value (stale-but-sourced); successes are committed and the run is marked
# failed so the breakage is visible.
name: Daily data refresh

on:
  schedule:
    # 23:30 UTC on weekdays, after the US close (07:30 Singapore next morning).
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests

      - name: Update daily-group data
        id: update
        run: |
          set +e
          python scripts/update_data.py --group daily | tee refresh.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build docs
        run: python scripts/build.py

      - name: Commit and push refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Automated daily data refresh"
          # data/ and docs/ are regenerated outputs of the same deterministic
          # pipeline over the same sources, so a run that published while this
          # one was building holds a version as good as this one's. Yield to it
          # rather than hand-merge generated JSON, and do not fail the run: the
          # data is not lost, it is superseded, and the next run regenerates.
          # Seen 2026-08-25 when the daily and monthly runs were dispatched
          # seconds apart; the twelve-hour gap in the schedules normally
          # prevents it, so this is the guard for the manual case.
          if ! git pull --rebase origin main; then
            git rebase --abort
            git reset --hard origin/main
            echo "A concurrent refresh published first; this run's data was superseded."
            exit 0
          fi
          if ! git push origin main; then
            echo "Push rejected by a concurrent refresh; this run's data was superseded."
            exit 0
          fi

      # The run still goes red on the first failure — that is the earliest signal
      # and a parser is usually a one-sitting fix. What changed is that the
      # message names the builders and any row that parked, so four weeks of
      # failures do not read as four identical emails.
      - name: Surface builder failures
        if: steps.update.outputs.exit_code != '0'
        shell: bash
        run: |
          {
            echo "### Builder failures"
            echo '```'
            grep -E '^(ERROR|WARNING|  PARKED)' refresh.log || echo "(see the refresh step log)"
            echo '```'
            echo "Previous values were retained for those rows. A row parks once it has"
            echo "been failing past its group budget: it is shown as context, excluded"
            echo "from the lens roll-up, and labelled stale on the page and in the digest."
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(ERROR|WARNING|  PARKED)' refresh.log || true
          exit 1
